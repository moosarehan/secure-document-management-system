{% extends 'base.html' %}
{% block title %}Sign in · Document vault{% endblock %}
{% block content %}
<section class="panel login">
  <h1>Sign in</h1>
  {% if error %}<p class="notice error" role="alert">{{ error }}</p>{% endif %}
  <form class="stack" method="post" action="{{ url_for('login') }}">
    <input type="hidden" name="csrf" value="{{ session.csrf }}">
    <label>Username <input name="username" autocomplete="username" maxlength="40" required autofocus></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" maxlength="256" required></label>
    <button>Sign in</button>
  </form>
</section>
{% endblock %}
