<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="520" viewBox="0 0 1250 520" role="img" aria-labelledby="title desc">
<title id="title">Secure Document Management System architecture</title>
<desc id="desc">Browser and local operator communicate with a trusted Flask process. Flask reads separate service keys and stores encrypted files, metadata and authenticated audit records in SQLite.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#306978"/></marker></defs>
<style>
text {font-family: 'Segoe UI', Arial, sans-serif; fill:#173645}
.title{font-size:33px;font-weight:700}.label{font-size:23px;font-weight:650}.copy{font-size:17px}.edge{font-size:16px;fill:#285567}
.frame{fill:#f4f8f9;stroke:#bad0d5;stroke-width:2}.node{fill:#fff;stroke:#54929d;stroke-width:2}.hub{fill:#e6f4f0;stroke:#419280;stroke-width:2}
.wire{fill:none;stroke:#306978;stroke-width:2.5;marker-end:url(#arrow)}.both{marker-start:url(#arrow)}
</style>
<rect width="1250" height="520" fill="#ffffff"/>
<text class="title" x="35" y="56">System architecture and data flows</text>
<rect class="frame" x="410" y="91" width="805" height="390" rx="18"/>
<text class="label" x="435" y="128">Trusted server and OS boundary</text>
<rect class="node" x="35" y="168" width="225" height="100" rx="12"/>
<text class="label" x="53" y="207">Browser</text><text class="copy" x="53" y="237">Owner, recipient, auditor</text>
<rect class="node" x="35" y="340" width="225" height="96" rx="12"/>
<text class="label" x="53" y="377">Local operator</text><text class="copy" x="53" y="406">CLI account management</text>
<rect class="hub" x="462" y="165" width="326" height="263" rx="14"/>
<text class="label" x="486" y="206">Application service</text>
<text class="copy" x="486" y="242">Flask routes and local operator CLI</text><text class="copy" x="486" y="274">Live document permission checks</text>
<text class="copy" x="486" y="306">AES-GCM encryption and verification</text><text class="copy" x="486" y="338">HMAC audit chain and checkpoint</text>
<text class="copy" x="486" y="391">Plaintext handled in process memory</text>
<rect class="node" x="950" y="165" width="225" height="116" rx="12"/>
<text class="label" x="970" y="201">SQLite database</text><text class="copy" x="970" y="233">Policy, files and audit</text><text class="copy" x="970" y="258">One atomic transaction</text>
<rect class="node" x="950" y="337" width="225" height="91" rx="12"/>
<text class="label" x="970" y="372">Separate key file</text><text class="copy" x="970" y="402">Wrapping, audit, cookie</text>
<path class="wire both" d="M266 221H453"/><text class="edge" x="283" y="204">Credentials and forms</text><text class="edge" x="283" y="247">Authorized download</text>
<path class="wire" d="M267 389H454"/><text class="edge" x="296" y="370">Operator actions</text>
<path class="wire both" d="M795 221H943"/><text class="edge" x="817" y="204">Read and write</text>
<path class="wire" d="M944 385H796"/><text class="edge" x="827" y="368">Load keys</text>
</svg>
